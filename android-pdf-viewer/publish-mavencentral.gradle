apply plugin: 'maven-publish'
apply plugin: 'signing'

def isAndroid = plugins.hasPlugin('com.android.library')

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

ext["signing.keyId"] = ''
ext["signing.password"] = ''
ext["signing.secretKeyRingFile"] = ''
ext["ossrhUsername"] = ''
ext["ossrhPassword"] = ''
ext["sonatypeStagingProfileId"] = ''

File secretPropsFile = project.rootProject.file('local.properties')
ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID')
ext["signing.password"] = System.getenv('SIGNING_PASSWORD')
ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_SECRET_KEY_RING_FILE')
ext["ossrhUsername"] = project.findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
ext["ossrhPassword"] = project.findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
ext["sonatypeStagingProfileId"] = System.getenv('SONATYPE_STAGING_PROFILE_ID')

afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                if (isAndroid) {
                    def releaseComponent = components.findByName("release")
                    if (releaseComponent != null) {
                        from(releaseComponent)
                    } else {
                        logger.warn("[publish] Release component not found. Available: ${components*.name}")
                    }
                } else if (components.findByName("java")) {
                    from components.java
                }

                groupId PUBLISH_GROUP_ID
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'Fork of Barteksc AndroidPdfViewer - Android view for displaying PDFs rendered with PdfiumAndroid'
                    url = 'https://github.com/mhiew/AndroidPdfViewer'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'min'
                            name = 'Min Hiew'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/mhiew/AndroidPdfViewer'
                        developerConnection = 'scm:git:ssh:github.com:mhiew/AndroidPdfViewer.git'
                        url = 'https://github.com/mhiew/AndroidPdfViewer'
                    }
                }
            }
        }
        repositories {
            maven {
                name = "sonatype"
                url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                credentials {
                    username ossrhUsername
                    password ossrhPassword
                }
            }
        }
    }
}

signing {
    sign publishing.publications
}